<?xml version="1.0" encoding="utf-8"?>
<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:app="http://schemas.android.com/apk/res-auto"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:orientation="vertical"
    android:background="@color/background">

    <!-- Header -->
    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:background="@color/primary"
        android:padding="20dp"
        android:orientation="vertical">

        <TextView
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="@string/society_title"
            android:textColor="#FFFFFF"
            android:textSize="22sp"
            android:textStyle="bold" />

        <TextView
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:text="@string/society_subtitle"
            android:textColor="#D1D5DB"
            android:textSize="14sp" />
    </LinearLayout>

    <!-- Overview Cards -->
    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="horizontal"
        android:padding="12dp"
        android:weightSum="2">

        <androidx.cardview.widget.CardView
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:layout_marginEnd="6dp"
            app:cardCornerRadius="10dp"
            app:cardElevation="3dp">
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:padding="16dp"
                android:orientation="vertical">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="जमा राशि (Paid)"
                    android:textSize="13sp"
                    android:textColor="@color/text_secondary" />
                <TextView
                    android:id="@+id/tvTotalCollected"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="₹ 0"
                    android:textSize="18sp"
                    android:textColor="@color/status_paid"
                    android:textStyle="bold" />
            </LinearLayout>
        </androidx.cardview.widget.CardView>

        <androidx.cardview.widget.CardView
            android:layout_width="0dp"
            android:layout_height="wrap_content"
            android:layout_weight="1"
            android:layout_marginStart="6dp"
            app:cardCornerRadius="10dp"
            app:cardElevation="3dp">
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:padding="16dp"
                android:orientation="vertical">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="बकाया (Pending)"
                    android:textSize="13sp"
                    android:textColor="@color/text_secondary" />
                <TextView
                    android:id="@+id/tvTotalPending"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="₹ 0"
                    android:textSize="18sp"
                    android:textColor="@color/status_pending"
                    android:textStyle="bold" />
            </LinearLayout>
        </androidx.cardview.widget.CardView>
    </LinearLayout>

    <!-- Search / Filter -->
    <EditText
        android:id="@+id/etSearchFlat"
        android:layout_width="match_parent"
        android:layout_height="48dp"
        android:layout_marginHorizontal="12dp"
        android:layout_marginBottom="8dp"
        android:background="@android:color/white"
        android:hint="मकान / फ्लैट नंबर खोजें..."
        android:paddingHorizontal="14dp"
        android:textSize="14sp" />

    <!-- Flats / Maintenance List -->
    <ListView
        android:id="@+id/lvMaintenanceList"
        android:layout_width="match_parent"
        android:layout_height="0dp"
        android:layout_weight="1"
        android:divider="@android:color/transparent"
        android:dividerHeight="8dp"
        android:paddingHorizontal="12dp" />

</LinearLayout>
package com.shreegangavihar.maintenance;

import android.os.Bundle;
import android.text.Editable;
import android.text.TextWatcher;
import android.view.LayoutInflater;
import android.view.View;
import android.view.ViewGroup;
import android.widget.ArrayAdapter;
import android.widget.EditText;
import android.widget.ListView;
import android.widget.TextView;
import androidx.annotation.NonNull;
import androidx.annotation.Nullable;
import androidx.appcompat.app.AppCompatActivity;

import java.util.ArrayList;
import java.util.List;

public class MainActivity extends AppCompatActivity {

    public static class FlatMember {
        String flatNo;
        String residentName;
        int amount;
        boolean isPaid;

        public FlatMember(String flatNo, String residentName, int amount, boolean isPaid) {
            this.flatNo = flatNo;
            this.residentName = residentName;
            this.amount = amount;
            this.isPaid = isPaid;
        }
    }

    private List<FlatMember> allMembers;
    private List<FlatMember> displayedMembers;
    private MaintenanceAdapter adapter;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        TextView tvTotalCollected = findViewById(R.id.tvTotalCollected);
        TextView tvTotalPending = findViewById(R.id.tvTotalPending);
        EditText etSearch = findViewById(R.id.etSearchFlat);
        ListView lvList = findViewById(R.id.lvMaintenanceList);

        // डेमो रिकॉर्ड्स (श्री गंगा विहार)
        allMembers = new ArrayList<>();
        allMembers.add(new FlatMember("101", "राजेश शर्मा", 1200, true));
        allMembers.add(new FlatMember("102", "अमित वर्मा", 1200, false));
        allMembers.add(new FlatMember("201", "सुरेश कुमार", 1200, true));
        allMembers.add(new FlatMember("202", "दिनेश गुप्ता", 1200, false));
        allMembers.add(new FlatMember("301", "महेश जोशी", 1200, true));

        displayedMembers = new ArrayList<>(allMembers);

        // कुल कैलकुलेशन
        int totalPaid = 0;
        int totalPending = 0;
        for (FlatMember m : allMembers) {
            if (m.isPaid) totalPaid += m.amount;
            else totalPending += m.amount;
        }
        tvTotalCollected.setText("₹ " + totalPaid);
        tvTotalPending.setText("₹ " + totalPending);

        adapter = new MaintenanceAdapter(this, displayedMembers);
        lvList.setAdapter(adapter);

        // सर्च फ़िल्टर
        etSearch.addTextChangedListener(new TextWatcher() {
            @Override
            public void beforeTextChanged(CharSequence s, int start, int count, int after) {}

            @Override
            public void onTextChanged(CharSequence s, int start, int before, int count) {
                filterList(s.toString());
            }

            @Override
            public void afterTextChanged(Editable s) {}
        });
    }

    private void filterList(String query) {
        displayedMembers.clear();
        for (FlatMember m : allMembers) {
            if (m.flatNo.toLowerCase().contains(query.toLowerCase()) || 
                m.residentName.toLowerCase().contains(query.toLowerCase())) {
                displayedMembers.add(m);
            }
        }
        adapter.notifyDataSetChanged();
    }

    private class MaintenanceAdapter extends ArrayAdapter<FlatMember> {
        public MaintenanceAdapter(MainActivity context, List<FlatMember> list) {
            super(context, 0, list);
        }

        @NonNull
        @Override
        public View getView(int position, @Nullable View convertView, @NonNull ViewGroup parent) {
            if (convertView == null) {
                convertView = LayoutInflater.from(getContext()).inflate(android.R.layout.simple_list_item_2, parent, false);
            }
            FlatMember m = getItem(position);
            TextView text1 = convertView.findViewById(android.R.id.text1);
            TextView text2 = convertView.findViewById(android.R.id.text2);

            if (m != null) {
                text1.setText("मकान नं: " + m.flatNo + " - " + m.residentName);
                String status = m.isPaid ? "✓ जमा (Paid): ₹" + m.amount : "✗ बकाया (Pending): ₹" + m.amount;
                text2.setText(status);
                text2.setTextColor(m.isPaid ? 0xFF10B981 : 0xFFEF4444);
            }
            return convertView;
        }
    }
}
name: Build Shree Ganga Vihar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: ShreeGangaViharApp-Debug
        path: app/build/outputs/apk/debug/*.apk
        
