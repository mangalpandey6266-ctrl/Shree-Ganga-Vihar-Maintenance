pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "ShreeGangaViharApp"
include ':app'
plugins {
    id 'com.android.application' version '8.2.0' apply false
}
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shreegangavihar.maintenance'
    compileSdk 34

    defaultConfig {
        applicationId "com.shreegangavihar.maintenance"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
}
<resources>
    <string name="app_name">Shree Ganga Vihar</string>
    <string name="society_title">श्री गंगा विहार समिति</string>
    <string name="society_subtitle">सोसायटी मेंटेनेंस एवं ट्रैकर</string>
</resources>
